<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student account — Eagles Community</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="account.css"></head><body><header class="simple-header"><a class="brand" href="/Eagles-homepage.html"><span class="brand-mark">E</span>Eagles Community</a><div class="language-switch" data-language-switch></div></header><main class="panel account-panel"><p class="eyebrow" data-i18n="studentPortal">STUDENT PORTAL</p><h1 data-i18n="accountTitle">Your Eagles account</h1><p class="muted" data-i18n="accountSubtitle">Register if you already study at Eagles Community. An administrator will verify your account.</p><div class="form-columns"><form id="register" method="post" action="/account.html"><h2 data-i18n="registerTitle">Create an account</h2><label><span data-i18n="firstName">First name</span><input name="firstName" autocomplete="given-name" maxlength="70" required></label><label><span data-i18n="lastName">Last name</span><input name="lastName" autocomplete="family-name" maxlength="70" required></label><label><span data-i18n="groupName">Study group</span><input name="groupName" maxlength="70" required></label><label><span data-i18n="email">Email</span><input name="email" type="email" autocomplete="email" required></label><label><span data-i18n="password">Password (8+ characters)</span><input name="password" type="password" autocomplete="new-password" minlength="8" required></label><button type="submit" data-i18n="createAccount">Create account</button></form><form id="login" method="post" action="/account.html"><h2 data-i18n="loginTitle">Already registered?</h2><label><span data-i18n="email">Email</span><input name="email" type="email" autocomplete="email" required></label><label><span data-i18n="passwordShort">Password</span><input name="password" type="password" autocomplete="current-password" required></label><button type="submit" data-i18n="signIn">Sign in</button><p class="muted small" data-i18n="approvalNote">New accounts require administrator approval.</p></form></div><p id="message" role="status" aria-live="polite"></p><div class="panel-links"><a href="/join.html" data-i18n="backChoices">Back to options</a><a href="/Eagles-homepage.html" data-i18n="backHome">Back to homepage</a></div></main><script src="site-i18n.js" defer></script><script src="account.js" defer></script></body></html>
