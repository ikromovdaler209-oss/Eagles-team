<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Eagles-front.css">
</head>
<body id="body2">
    <div class="speaking-wrap">
        <h1 id="hh1">Writing questions</h1>

        <div class="part-tabs">
            <input type="radio" id="radiop1" name="part" class="radio" checked>
            <label for="radiop1"><b>Part 1</b></label>

            <input type="radio" id="radiop2" name="part" class="radio">
            <label for="radiop2"><b>Part 2</b></label>
        </div>

        <div id="imgBox10" class="task-image">
            <span class="task-image-placeholder">Chart / table will appear here</span>
            <img id="taskImg" alt="Writing Task 1 chart or table">
        </div>

        <div id="box11" class="question-box">
            <span class="question-placeholder">Choose a part and press "Find question"</span>
        </div>

        <button id="btn11" class="find-btn" type="button">Find question</button>
    </div>

    <script src="project.js"></script>
</body>
</html>
