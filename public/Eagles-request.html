<!DOCTYPE html>
<html lang="en">
<head>
<script src="site-copy.js" defer></script>
<script src="site-i18n.js" defer></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eagles - Request</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Eagles-front.css">
<link rel="stylesheet" href="site-nav.css">
</head>
<body>
    <header class="site-header">
    <a class="site-brand" href="Eagles-homepage.html"><span class="site-mark" aria-hidden="true">E</span>Eagles-Community</a>
    <button class="site-toggle" type="button" aria-controls="mainNav" aria-expanded="false" aria-label="Open menu">☰</button>
    <nav id="mainNav" class="site-nav" aria-label="Main navigation">
        <a href="Eagles-homepage.html">Home</a>
        <a href="Eagles.courses.html">Courses</a>
        <a href="Eagles-teachers.html">Teachers</a>
        <a href="Eagles-about.html">About</a>
        <a href="Eagles-contacts.html">Contacts</a>
        <a href="practice.html">Practice</a>
        <a href="join.html" aria-current="location">Join Us</a>
    </nav>
</header>


    <main class="courses-page">

        <section class="courses-hero">
            <div class="hero-shape" aria-hidden="true"></div>
            <span class="eyebrow">SIGN UP</span>
            <h1 class="head2">Start your journey with <span class="accent">EAGLES</span></h1>
            <span id="text1">Fill in your details below and we'll match you
            with the right course and teacher.</span>
        </section>

        <section class="register-section">
            <div class="register-card">
                <form class="register-form" id="registerForm" action="#" method="post">

                    <div class="form-group">
                        <label for="firstName">Name</label>
                        <input type="text" id="firstName" name="firstName" placeholder="Enter name" required>
                    </div>

                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" name="lastName" placeholder="Enter Last name" required>
                    </div>

                    <div class="form-group">
                        <label for="age">Age</label>
                        <input type="number" inputmode="numeric" id="age" name="age" placeholder="Enter age" min="1" required>
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <select id="subject" name="course" required>
                            <option value="" selected disabled>Choose a course</option>
                            <option value="Grammar">Grammar</option>
                            <option value="Pre IELTS">Pre IELTS</option>
                            <option value="IELTS">IELTS</option>
                            <option value="CEFR">CEFR</option>
                        </select>
                    </div>

                    <div class="form-group form-group-wide">
                        <label for="phone">Phone Number</label>
                        <input type="tel" inputmode="tel" id="phone" name="phone" placeholder="+998" required>
                    </div>
                    <div class="form-group honeypot">
                    <label for="website">Website</label>
                    <input
                        type="text"
                        id="website"
                        name="website"
                        autocomplete="off"
                        tabindex="-1"
                    >
                </div>
                    <button class="btn2 form-submit" id="sendButton" type="button">Send Request</button>
                    
                </form>
                
            </div>
        </section>
<p id="status">Status:</p>
    </main>
   <script src="project.js" defer></script>
<script src="site-nav.js" defer></script>
</body>
</html>
