<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaking-Questions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Eagles-front.css">
</head>
<body class="speaking-page">
    <h1 id="myh1"> <span class="logo-speaking"></span> Eagles-Community</h1>
    <div class="speaking-wrap">
        <h1 id="hh1">Speaking questions</h1>
 
        <div class="part-tabs">
            <input type="radio" id="radio1" name="part" class="radio" checked>
            <label for="radio1"><b>Part 1</b></label>
 
            <input type="radio" id="radio2" name="part" class="radio">
            <label for="radio2"><b>Part 2</b></label>
 
            <input type="radio" id="radio3" name="part" class="radio">
            <label for="radio3"><b>Part 3</b></label>
        </div>
 
        <div id="box10" class="question-box">
            <span class="question-placeholder">Choose a part and press "Find question"</span>
        </div>
 
        <button id="btn10" class="find-btn" type="button">Find question</button>
    </div>
 
    <script src="project.js"></script>
</body>
</html>
